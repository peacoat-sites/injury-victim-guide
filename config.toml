baseURL = "https://injuryvictimguide.com/"
enableGitInfo = true
languageCode = "en-us"
title = "Injury Victim Guide"
[pagination]
  pagerSize = 12
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Know your rights after an injury. Clear, honest guides on personal injury claims, settlements, insurance tactics, and how to protect yourself after an accident."
  niche = "Personal Injury Law"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "injury accident legal consultation attorney"
  author = "Injury Victim Guide Editorial Team"
  logo_text = "Injury Victim Guide"
  tagline = "Know Your Rights. Protect Your Recovery."
  primary_color = "#8b0000"
  cloudflare_analytics = ""

  # Authority theme
  hero_color_1 = "#1c0a0a"
  hero_color_2 = "#7f1d1d"
  hero_color_3 = "#b91c1c"
  hero_color_4 = "#0f172a"
  monthly_readers = 74000
  research_hours  = 720
  satisfaction    = 98
  trust_extra     = "Attorney-reviewed content"
  impact_verification = ""
  impact_tracking_id  = "" 

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50
